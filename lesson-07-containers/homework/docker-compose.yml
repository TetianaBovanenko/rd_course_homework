# Tasks 3 and 4 — two-service Docker Compose stack.
# Specification: ../SPEC.md → "docker-compose".

services:

  # PostgreSQL database service.
  postgres:
    image: postgres:16-alpine

    # PostgreSQL credentials and database name come from .env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    # Store PostgreSQL data in a named volume.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Check whether PostgreSQL is ready to accept connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Ingestor service.
  # Downloads GitHub Archive data and loads it into PostgreSQL.
  ingestor:
    build: .

    # Connect to PostgreSQL using the Docker service name.
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      ARCHIVE_URL: ${ARCHIVE_URL}

    # Start only after PostgreSQL becomes healthy.
    depends_on:
      postgres:
        condition: service_healthy

    # Named volume for the download cache.
    volumes:
      - ingest_cache:/cache

volumes:
  postgres_data:
  ingest_cache: